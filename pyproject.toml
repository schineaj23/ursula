[project]
name = "ursula"
version = "0.1.0"
description = "A library research capability for Virginia Tech, exposed over HTTP and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
mcp  = ["mcp>=1.2"]
all  = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=1.2"]
dev  = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
ursula = "ursula.cli:main"
ursula-mcp = "ursula.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ursula"]

[tool.pytest.ini_options]
markers = ["live: calls the real upstream APIs; enable with --live"]
asyncio_mode = "auto"
testpaths = ["tests"]
